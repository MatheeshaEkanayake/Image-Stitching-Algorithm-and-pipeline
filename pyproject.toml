[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "image-stitch"
version = "0.2.0"
description = "Build one panorama from ordered, overlapping photos (SIFT/ORB, RANSAC homographies, feather blending)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn[standard]>=0.29"]

[project.scripts]
image-stitch = "stitcher.cli:main"
image-stitch-server = "stitcher.server.__main__:main"

[tool.setuptools]
packages = ["stitcher", "stitcher.server"]

[tool.setuptools.package-data]
"stitcher.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["Stitch", "baseline", "out", "Results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

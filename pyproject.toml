[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "image-stitch"
version = "0.2.0"
description = "Build one panorama from ordered, overlapping photos (SIFT/ORB, RANSAC homographies, feather blending)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
image-stitch = "stitcher.cli:main"

[tool.setuptools]
packages = ["stitcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["Stitch", "baseline", "out", "Results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
